apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: incident-agent
  labels: {app: kafka-producer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-producer}
  template:
    metadata:
      labels: {app: kafka-producer}
    spec:
      containers:
        - name: kafka-producer
          image: incident-agent/kafka-producer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: KAFKA_BROKERS
              value: redpanda:9092
            - name: KAFKA_TOPIC
              value: orders
            - name: PRODUCE_INTERVAL_S
              value: "1"
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-producer
  namespace: incident-agent
  labels: {app: kafka-producer}
spec:
  selector: {app: kafka-producer}
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
