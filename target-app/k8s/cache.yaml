# "cache" dependency: stock redis image, no custom code needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: incident-agent
  labels: {app: cache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: incident-agent
  labels: {app: cache}
spec:
  selector: {app: cache}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
