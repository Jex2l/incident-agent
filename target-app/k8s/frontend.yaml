apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: incident-agent
  labels: {app: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: incident-agent/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CART_URL
              value: http://cart:8080
            - name: TRAFFIC_INTERVAL_S
              value: "2"
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: incident-agent
  labels: {app: frontend}
spec:
  selector: {app: frontend}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
