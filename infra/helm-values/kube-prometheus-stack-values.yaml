# Minimal-resource values for prometheus-community/kube-prometheus-stack.
# Tuned for an 8-core/16GB kind node, not production.
fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 1Gi}
    # Pick up ServiceMonitors/PrometheusRules from every namespace regardless
    # of chart-release labels, so target-app/infra manifests don't need to
    # carry kube-prometheus-stack's own release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    walCompression: true
  service:
    type: NodePort
    nodePort: 30090

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 25m, memory: 96Mi}
      limits: {cpu: 200m, memory: 256Mi}
  service:
    type: NodePort
    nodePort: 30093
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: webhook-receiver
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 2h
    receivers:
      - name: webhook-receiver
        webhook_configs:
          # Dumb logger (used by fault scripts' wait_for_alert and
          # infra/verify-phase1.sh) and the real agent orchestrator, which
          # runs on the host (not in-cluster) and is reached via Docker
          # Desktop's host.docker.internal DNS name.
          - url: http://webhook-receiver.incident-agent.svc.cluster.local:8080/alerts
            send_resolved: true
          - url: http://host.docker.internal:8010/webhook
            send_resolved: true
      # kube-prometheus-stack's default rules include a "Watchdog" heartbeat
      # alert that always fires, routed to a receiver literally named "null"
      # by chart convention (not Go nil - this is swallowed, not an error).
      # It must exist or Alertmanager's own config validation rejects the
      # whole config with "undefined receiver \"null\" used in route".
      - name: "null"

grafana:
  adminPassword: admin
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: 400m, memory: 400Mi}
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: false
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard}
    datasources: {enabled: true}
    resources:
      requests: {cpu: 25m, memory: 48Mi}
      limits: {cpu: 100m, memory: 96Mi}

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

# Keep the stack lean: these components aren't needed for this project.
kubeApiServer: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
