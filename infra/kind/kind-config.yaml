# kind cluster config for incident-agent.
# Single control-plane + single worker keeps resource usage low (fits 16GB RAM machines).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-agent
nodes:
  - role: control-plane
    extraPortMappings:
      # Grafana
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Prometheus
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Alertmanager
      - containerPort: 30093
        hostPort: 9093
        protocol: TCP
      # Webhook receiver / agent orchestrator
      - containerPort: 30800
        hostPort: 8000
        protocol: TCP
      # Loki (verify-phase1.sh falls back to kubectl port-forward if this
      # mapping isn't present, e.g. on a cluster created before this was added)
      - containerPort: 30100
        hostPort: 3100
        protocol: TCP
  - role: worker
