apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webhook-receiver-data
  namespace: incident-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: incident-agent
  labels: {app: webhook-receiver}
spec:
  replicas: 1
  selector:
    matchLabels: {app: webhook-receiver}
  template:
    metadata:
      labels: {app: webhook-receiver}
    spec:
      containers:
        - name: webhook-receiver
          image: incident-agent/webhook-receiver:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ALERT_LOG_PATH
              value: /data/alerts.jsonl
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webhook-receiver-data
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: incident-agent
  labels: {app: webhook-receiver}
spec:
  type: NodePort
  selector: {app: webhook-receiver}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30800
