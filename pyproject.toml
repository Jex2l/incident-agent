[project]
name = "incident-agent"
version = "0.1.0"
description = "On-call incident triage agent: investigates Prometheus/Alertmanager alerts and proposes remediations with human-approved execution."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "mcp==1.9.4",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "kubernetes==31.0.0",
    "rank-bm25==0.2.2",
    "numpy==2.2.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "respx==0.22.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "tools", "agent", "executor"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "tools", "executor"]
